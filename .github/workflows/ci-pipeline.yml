name: ci-pipeline

on:
  workflow_dispatch:
    inputs:
      DM_REPO:
        description: Datamine repository
        required: true
        type: string
        default: github:iam-akuzihs/excel/live
      allow_full_regen:
        description: Opt in to a full pipeline run. Generated files are still not deleted first, and the character and ICD guards remain on.
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        id: nix-cache
        with:
          primary-key: ${{ runner.os }}-nix-${{ hashFiles('**/*.nix', '**/flake.lock', '**/multiverse.lock') }}
      - name: Prefetch nix store
        if: steps.nix-cache.outputs.hit-primary-key != 'true'
        run: |-
          nix develop -c true

      - name: Setup go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: nix-${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: nix-${{ runner.os }}-go-

      - name: Run pipeline
        env:
          DM_REPO: ${{ inputs.DM_REPO }}
          GCSIM_ALLOW_FULL_REGEN: ${{ inputs.allow_full_regen && '1' || '0' }}
        run: |-
          set -eu

          # Do not delete tracked generated files before validation.
          # The old clean step ran before the in-process guards could refuse.
          if [ "${GCSIM_ALLOW_FULL_REGEN}" != "1" ]; then
            echo "refusing full pipeline regeneration: allow_full_regen is false; checked-in generated files were not modified" >&2
            git diff --quiet
            git diff --cached --quiet
            exit 1
          fi

          nix develop -c task pipeline -- run -remote -no-cache
          nix develop -c task pipeline-add > /dev/null 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pipeline: generate files" || exit 0
          git push
