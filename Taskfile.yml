version: '3'

tasks:
  build:
    desc: Compile cmd/gcsim from checked-in generated data
    cmds:
      - go build -o {{.OUT | default "gcsim"}} ./cmd/gcsim
  build-generated:
    desc: Regenerates protobufs, pipeline tables, and editor keys. Not a supported build.
    cmds:
      - task: protos
      - task: pipeline
      - task: editor-keys
  # Generate protobuf code with buf (uses hosted remote plugins, so no local
  # protoc / protoc-gen-* toolchain is required). Config: buf.gen.yaml.
  protos:
    desc: Generate protobuf code with buf
    cmds:
      - buf generate
      - task: protos:post
  # Post-generation: add bson tags to the generated Go structs and regenerate
  # msgp code.
  protos:post:
    internal: true
    cmds:
      - go run scripts/bsontags/main.go -dir ./pkg/model -verbose
      - task: msgp
  msgp:
    cmd: go generate ./pkg/stats

  pipeline:
    desc: Run pipeline after the regeneration gate. Uses checked-in pipeline/kind_enumer.go.
    vars:
      CLI_ARGS: '{{.CLI_ARGS | default "run"}}'
    cmds:
      - sh scripts/pipeline-preflight.sh
      - go run ./pipeline {{.CLI_ARGS}}
  # Unsupported maintenance. Rewrites pipeline/kind_enumer.go from the
  # go:generate directive on pipeline/spec.go. Not used by task pipeline
  # or task build. The preflight still refuses unless GCSIM_ALLOW_FULL_REGEN=1.
  pipeline-enumer:
    desc: Unsupported maintenance. Regenerates pipeline/kind_enumer.go. Not a normal pipeline run.
    cmds:
      - sh scripts/pipeline-preflight.sh
      - go generate ./pipeline
  editor-keys:
    desc: Generate the config editor's keyword tables from pkg/gcs/ast
    cmd: go run ./cmd/editorkeys
  pipeline-add:
    cmds:
      - git add -v 'ui/packages/docs/docs/reference/*/*.md' > /dev/null
      - git add -v '*.dm.*'
  pipeline-clean:
    desc: Refuses to delete generated files. Deletion before validation is disabled.
    cmds:
      - sh scripts/pipeline-clean.sh

  enumer:
    cmds:
      - go generate ./pkg/core/attributes

  wasm:
    dir: cmd/wasm
    cmds:
      - cmd: GOOS= GOARCH= go run ../sharekeygen
        if: '{{if .GCSIM_SHARE_KEY}}true{{else}}false{{end}}'
      - go build -trimpath {{if .GCSIM_SHARE_KEY}}-tags sharekey{{end}} -o '{{.OUT | default "main.wasm"}}'
      - echo "compiled wasm successfully!"
    env:
      GOOS: js
      GOARCH: wasm

  lint:
    desc: Run golangci-lint
    cmd: golangci-lint run

  lint-fix:
    desc: Run golangci-lint and fix issues
    cmd: golangci-lint run --fix

  dev-server-mode:
    desc: watches for change and launches server mode
    watch: true
    sources:
      - '**/*.go'
    vars:
      WIN_CMD: Get-CimInstance -ClassName Win32_PRocess -Filter "CommandLine LIKE '%GCSIM_SERVER%'" | ForEach-Object -Process {taskkill /F /PID $_.ProcessId}
    cmds:
      - cmd: powershell {{shellQuote .WIN_CMD}}
        platforms: [windows]
        ignore_error: true
      - cmd: pkill -f GCSIM_SERVER=1
        platforms: [linux, darwin]
        ignore_error: true
      - go run cmd/server/main.go GCSIM_SERVER=1
